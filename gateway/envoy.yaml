static_resources:
  listeners:
    - name: public
      address:
        socket_address: {address: 0.0.0.0, port_value: 8080}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                generate_request_id: true
                use_remote_address: true
                tracing:
                  client_sampling: {value: 100.0}
                  random_sampling: {value: 100.0}
                  overall_sampling: {value: 100.0}
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      service_name: lab28-gateway
                      grpc_service:
                        envoy_grpc: {cluster_name: otel_collector}
                        timeout: 0.5s
                route_config:
                  name: routes
                  virtual_hosts:
                    - name: lab28
                      domains: ["*"]
                      response_headers_to_add:
                        - header: {key: x-request-id, value: "%REQ(X-REQUEST-ID)%"}
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      routes:
                        - match: {path: /healthz}
                          direct_response: {status: 200, body: {inline_string: "ok\n"}}
                        - match: {prefix: /}
                          decorator: {operation: lab28.gateway.request}
                          route: {cluster: api, timeout: 120s}
                http_filters:
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: lab28
                      token_bucket:
                        max_tokens: 10
                        tokens_per_fill: 10
                        fill_interval: 1s
                      filter_enabled:
                        runtime_key: local_rate_limit_enabled
                        default_value: {numerator: 100, denominator: HUNDRED}
                      filter_enforced:
                        runtime_key: local_rate_limit_enforced
                        default_value: {numerator: 100, denominator: HUNDRED}
                      response_headers_to_add:
                        - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          header: {key: x-lab28-rate-limited, value: "true"}
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: api
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: api, port_value: 8000}
      health_checks:
        # 2s was tuned for dependencies on the same docker network. /ready's
        # vLLM leg can cross the public internet to a remote GPU endpoint
        # (Kaggle/Colab via tunnel), and that round trip alone can exceed 2s
        # under load - which made the active check time out and eject a pod
        # that was, in fact, ready. 5s tolerates that hop without meaningfully
        # slowing detection of a real outage: a local dependency answers in
        # milliseconds either way.
        - timeout: 5s
          interval: 2s
          unhealthy_threshold: 1
          healthy_threshold: 1
          # Active health-checks /ready, not /health. /health is liveness and
          # never touches a dependency, so a dead Qdrant or Kafka would never
          # eject this upstream and the gateway would keep routing traffic to
          # a pod that cannot serve it - the exact failure IT-J4 checks for.
          # /ready already returns 200 on "degraded" (an optional dependency
          # down) and 503 only on "not_ready" (a mandatory one), so this
          # matches the readinessProbe already used in
          # deploy/kubernetes/base/api.yaml and only ejects on the failure
          # that actually should take the pod out of rotation.
          #
          # Trade-off: once ejected, a caller hitting gateway:/ready gets
          # Envoy's own opaque 503 instead of the app's degraded-reason JSON,
          # because Envoy stops forwarding to an unhealthy upstream. That
          # detail is still visible by calling the API container directly on
          # :8000, or from the readiness gauges already on Grafana.
          #
          # The marker header lets the application tell this synthetic probe
          # apart from real traffic. Without it every two seconds of health
          # checking lands in lab28_requests_total{route="/ready"} and hides
          # whether a client ever reached that route.
          http_health_check:
            path: /ready
            request_headers_to_add:
              - header: {key: x-lab28-synthetic-probe, value: gateway-health-check}
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
      common_lb_config:
        healthy_panic_threshold: {value: 0}
    - name: otel_collector
      type: STRICT_DNS
      connect_timeout: 2s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: {http2_protocol_options: {}}
      load_assignment:
        cluster_name: otel_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: otel-collector, port_value: 4317}
admin:
  address:
    socket_address: {address: 0.0.0.0, port_value: 9901}
